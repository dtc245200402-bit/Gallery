limit_req_zone $binary_remote_addr zone=gallery_api:10m rate=10r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 55m;
    access_log /var/log/nginx-files/access.log;
    error_log /var/log/nginx-files/error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~* /(\.env|\.git|\.svn|package(-lock)?\.json|Dockerfile|docker-compose\.yml|.*\.sql)$ {
        deny all;
        return 404;
    }

    location /api/ {
        limit_req zone=gallery_api burst=30 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
